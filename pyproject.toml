[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factory"
version = "0.1.0"
description = "AI software factory CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.16.0",
]

[project.scripts]
factory = "factory.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/factory/resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
exclude = ["src/factory/resources"]

[[tool.mypy.overrides]]
module = "factory.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true
